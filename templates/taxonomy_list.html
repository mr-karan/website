{% extends "base.html" %}

{% block title %}Tags | {{ super() }}{% endblock %}

{% block main %}
<h1>Tags</h1>
<div class="tag-index">
  {%- for term in terms %}
  <a href="{{ term.permalink | safe }}">{{ term.name }} <span class="count">{{ term.pages | length }}</span></a>
  {%- endfor %}
</div>
{% endblock %}
